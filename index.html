<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Search movies and explore detailed movie information."
    >

    <title>CineSearch - Movie Search App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="container nav">

            <a href="#" class="logo">
                🎬 CineSearch
            </a>

            <span class="subtitle">
                Movie Search App
            </span>

        </div>

    </header>


    <!-- MAIN -->
    <main>

        <!-- HERO -->
        <section class="hero">

            <div class="container">

                <h1>Find Your Next Movie</h1>

                <p>
                    Search movies and explore ratings, descriptions,
                    release dates and more.
                </p>


                <!-- SEARCH -->
                <form
                    id="searchForm"
                    class="search-form"
                >

                    <div class="search-box">

                        <span class="search-icon">🔎</span>

                        <input
                            type="search"
                            id="searchInput"
                            placeholder="Search for a movie..."
                            autocomplete="off"
                            aria-label="Search for a movie"
                        >

                        <button
                            type="submit"
                            id="searchButton"
                        >
                            Search
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <!-- CONTENT -->
        <section class="content container">

            <!-- STATUS -->
            <div
                id="status"
                class="status"
                aria-live="polite"
            ></div>


            <!-- RESULTS -->
            <section>

                <div class="section-heading">

                    <h2 id="resultsTitle">
                        Search Results
                    </h2>

                    <span id="resultCount"></span>

                </div>


                <div
                    id="movieGrid"
                    class="movie-grid"
                ></div>

            </section>

        </section>

    </main>


    <!-- MOVIE DETAILS MODAL -->
    <div
        id="movieModal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div class="modal-overlay" id="modalOverlay"></div>


        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <button
                id="closeModal"
                class="close-button"
                aria-label="Close movie details"
            >
                ×
            </button>


            <div id="movieDetails"></div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="container">

            <p>
                CineSearch — Movie Search App
            </p>

            <p>
                Built with HTML, CSS, JavaScript and TMDB API
            </p>

        </div>

    </footer>


    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
